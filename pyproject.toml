[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "cellmapper"
description = "k-NN-based mapping of cells across representations"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Marius Lange", email = "marius.lange@bsse.ethz.ch" },
]
authors = [
  { name = "Marius Lange" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.11",
  "docrep",
  "numpy",
  "packaging",
  "pandas",
  "rich",
  "scanpy>=1.11",
  "scikit-learn",
  "scipy",
  # for debug logging (referenced from the issue template)
  "session-info2",
]
optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*,<0.22", # sphinx-tabs incompatible with 0.22, see https://github.com/executablebooks/sphinx-tabs/issues/206
  "ipykernel",
  "ipython",
  "ipywidgets",                            # for tqdm/notebook progress bars in Jupyter
  "myst-nb>=1.1",
  "pandas",
  # Until pybtex >0.24.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]
optional-dependencies.test = [
  "coverage>=7.10",
  "faiss-cpu",
  "pytest",
  "pytest-cov",     # For VS Code's coverage functionality
  "pytest-mock",    # provides the `mocker` fixture used in tests/test_check.py
  "squidpy>=1.8",
]
optional-dependencies.tutorials = [
  "cellrank>=2",
  "harmony-pytorch",
  "igraph",
  "netgraph",
  "python-louvain",
  "scvi-tools>=1.3",
  "seaborn",
  "sopa>=2.2",
  "squidpy>=1.8",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://cellmapper.readthedocs.io/"
urls.Homepage = "https://github.com/quadbio/cellmapper"
urls.Source = "https://github.com/quadbio/cellmapper"

# Opt-in fast backend for pyGPCCA (used by cellrank). Without petsc4py/slepc4py,
# pyGPCCA falls back to method='brandts', which densifies the transition matrix
# and warns. petsc4py/slepc4py come from cellrank's own `petsc` extra (mpi4py-free
# since cellrank 2.3.1), so CellRank owns those. This is a PEP 735 dependency
# group (NOT an extra) on purpose: petsc/slepc have no wheels and compile from
# source, so we keep them out of `uv sync --all-extras` and require explicit opt-in.
#
# `slepc` is listed explicitly because slepc4py's published sdist metadata omits
# its runtime dep on the `slepc` library package (it's added dynamically at build
# time), so uv won't install slepc from cellrank[petsc] alone and slepc4py then
# fails to import with "Library not loaded: libslepc". (petsc4py declares `petsc`
# correctly, so petsc needs no such workaround.) Drop this once slepc4py — or
# cellrank's petsc extra — declares slepc.
#
# petsc4py/slepc4py compute their metadata dynamically at build time. Without help,
# uv would therefore compile PETSc from source just to *resolve* — breaking every
# bare `uv sync` / `uv run` / `uv lock`, even when this group is NOT requested. The
# [[tool.uv.dependency-metadata]] entries under [tool.uv] give uv that metadata
# statically, so resolution/locking never builds anything; PETSc/SLEPc compile only
# when the group is actually installed. Keep those entries in sync with this group.
#
# INSTALLING the group is the fragile part. The recommended route is pre-built
# conda-forge binaries (no compiler, no BLAS hunting), e.g. with pixi/mamba:
#     mamba install -c conda-forge petsc4py slepc4py     # or: pixi add petsc4py slepc4py
# Building from PyPI source instead needs a C compiler AND a BLAS/LAPACK. The
# CellRank-documented options alone (--with-fc=0 --with-mpi=0 --with-debugging=0
# --with-shared-libraries=1) only work on machines that already expose a system
# BLAS on the linker path; on others PETSc configure fails with "Could not find a
# functional BLAS". Adding --download-f2cblaslapack=1 gets PETSc to build but then
# SLEPc fails to link it (`cannot find -lf2cblas`), so for a source build point
# PETSc at a real shared BLAS instead, e.g.:
#     PETSC_CONFIGURE_OPTIONS="--with-fc=0 --with-mpi=0 --with-debugging=0 \
#       --with-shared-libraries=1 --with-blaslapack-dir=$OPENBLAS_ROOT" \
#       uv sync --all-extras --group gpcca-fast
# Do NOT set SLEPC_CONFIGURE_OPTIONS — SLEPc inherits config from the built PETSc.
# NB: a plain `uv sync --all-extras` (without --group gpcca-fast) will UNINSTALL
# petsc/slepc if present — re-include the group on every refresh to keep them.
[dependency-groups]
gpcca-fast = [
  "cellrank[petsc]>=2.3.1",
  "slepc>=3.25",
]

[tool.hatch]
version.source = "vcs"
envs.default.installer = "uv"
envs.default.features = [ "dev" ]
envs.docs.features = [ "doc" ]
envs.docs.scripts.build = "sphinx-build -M html docs docs/_build {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
envs.hatch-test.features = [ "dev", "test" ]
envs.hatch-test.matrix = [
  # Test the lowest and highest supported Python versions with normal deps
  { deps = [ "stable" ], python = [ "3.12", "3.14" ] },
  # Test the newest supported Python version also with pre-release deps
  { deps = [ "pre" ], python = [ "3.14" ] },
]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
envs.hatch-test.overrides.matrix.deps.env-vars = [
  { value = "allow", key = "UV_PRERELEASE", if = [ "pre" ] },
]

[tool.uv]
# pygpcca 1.0.4 (pulled in by cellrank, tutorials extra) incorrectly pins
# jinja2==3.0.3, which conflicts with sphinx (doc extra). Override until a
# pygpcca release relaxes it. jinja2>=3.1 is known-safe (cellrank does the same).
override-dependencies = [ "jinja2>=3.1" ]
# Static metadata for the gpcca-fast source-only packages so uv can resolve/lock
# WITHOUT compiling PETSc (see the note above [dependency-groups]). These mirror
# the deps each package injects dynamically at build time: petsc4py -> petsc,
# slepc4py -> petsc4py + slepc (slepc4py's own sdist omits slepc). The `petsc`/
# `slepc` library packages have no Python dependencies. Version omitted -> applies
# to all versions; petsc & petsc4py (and slepc & slepc4py) are always co-released
# at matching versions, so uv resolves them in lockstep.
dependency-metadata = [
  { name = "petsc", requires-dist = [] },
  { name = "slepc", requires-dist = [] },
  { name = "petsc4py", requires-dist = [ "numpy", "petsc" ] },
  { name = "slepc4py", requires-dist = [ "numpy", "petsc4py", "slepc" ] },
]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.omit = [
  "**/test_*.py",
]
run.patch = [ "subprocess" ]
run.source = [ "cellmapper" ]

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
